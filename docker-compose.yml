version: "3.8"

# Variables below are interpolated from a `.env` file in this directory.
# See `.env.example` for the full list. Required at runtime: DB_PASS,
# ENCRYPT_KEY, MONITOR_PASS, NATS_USER, NATS_PASSWORD, and the NATS TLS
# certificate/key/CA files; ZATCA_SDK_PATH is required when building.

services:
  zatca-daemon:
    build:
      context: .
      additional_contexts:
        zatca-sdk: ${ZATCA_SDK_PATH:?ZATCA_SDK_PATH must point to the private ZATCA SDK root}
    container_name: zatca-daemon
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${NATS_PORT:-4222}:4222"   # NATS — your backend publishes here
      - "${NATS_MONITOR_PORT:-8222}:8222"   # NATS monitoring — http://localhost:8222
    volumes:
      - nats-data:/data/nats            # JetStream persistence
      - "${NATS_TLS_CERT_FILE:?NATS_TLS_CERT_FILE must point to the NATS server certificate}:/run/nats/tls/server.crt:ro"
      - "${NATS_TLS_KEY_FILE:?NATS_TLS_KEY_FILE must point to the NATS server key}:/run/nats/tls/server.key:ro"
      - "${NATS_TLS_CA_FILE:?NATS_TLS_CA_FILE must point to the NATS CA bundle}:/run/nats/tls/ca.crt:ro"
    environment:
      # --- DB connection (required) ---
      DB_USER: ${DB_USER:-zatca_daemon}
      DB_PASS: ${DB_PASS:?DB_PASS must be set in .env}
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-3306}
      MASTER_DB: ${MASTER_DB:-zatca_master}

      # --- Optional: separate admin user for onboarding ---
      ADMIN_DB_USER: ${ADMIN_DB_USER:-}
      ADMIN_DB_PASS: ${ADMIN_DB_PASS:-}

      # --- Encryption key for sensitive ZATCA credentials (required) ---
      # Generate with: openssl rand -base64 32
      ENCRYPT_KEY: ${ENCRYPT_KEY:?ENCRYPT_KEY must be set in .env}

      # --- NATS client authentication (required; never enable unauthenticated mode here) ---
      NATS_USER: ${NATS_USER:?NATS_USER must be set in .env}
      NATS_PASSWORD: ${NATS_PASSWORD:?NATS_PASSWORD must be set in .env}
      NATS_ALLOW_UNAUTHENTICATED: "false"
      NATS_LOCAL_TEST_MODE: "false"
      NATS_PRIVATE_NETWORK_ONLY: "false"
      NATS_TLS_CERT_FILE: /run/nats/tls/server.crt
      NATS_TLS_KEY_FILE: /run/nats/tls/server.key
      NATS_TLS_CA_FILE: /run/nats/tls/ca.crt
      NATS_TLS_SERVER_NAME: ${NATS_TLS_SERVER_NAME:-nats}

      # --- NATS monitoring password (required if port 8222 is exposed) ---
      MONITOR_PASS: ${MONITOR_PASS:?MONITOR_PASS must be set in .env}

      # --- SMTP for error alerts (uses host SMTP by default) ---
      SMTP_HOST: ${SMTP_HOST:-host.docker.internal}
      SMTP_PORT: ${SMTP_PORT:-25}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-zatca-daemon@localhost}
    command: ["--nats-mode=embedded", "--nats-monitor=8222", "--nats-data=/data/nats"]

volumes:
  nats-data:
